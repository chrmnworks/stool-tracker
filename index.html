<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stool tracker</title>
<style>
:root{--bg:#f3f6fa;--surface:#fff;--ink:#14213a;--muted:#5b6b82;--line:#d9e1ec;--accent:#1565c0;--accent-ink:#fff;color-scheme:light;
--t1:#a8651f;--t2:#c4862b;--t3:#3d9a6b;--t4:#2c8a5e;--t5:#d9a21b;--t6:#d9692b;--t7:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#0e1522;--surface:#162033;--ink:#e8eef8;--muted:#93a3bb;--line:#26344d;--accent:#5aa2f0;--accent-ink:#08111f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom))}
main{max-width:560px;margin:0 auto;display:grid;gap:16px}
h1{font-size:1.6rem;margin:8px 0 0;letter-spacing:-.01em}
h2{font-size:1.05rem;margin:0 0 12px}
section{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.today{display:flex;align-items:baseline;gap:10px}
.today b{font-size:3rem;line-height:1;font-weight:700}
.today span{color:var(--muted)}
.types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.types button{border:2px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:8px 4px;font:inherit;cursor:pointer;display:grid;gap:2px;justify-items:center}
.types button img{display:block;height:30px;max-width:100%;object-fit:contain}
.types button strong{font-size:1.1rem;line-height:1.1}
.types button small{font-size:.68rem;color:var(--muted);line-height:1.2;text-align:center}
.types button[aria-pressed=true]{border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:10px}
input,textarea,select{display:block;width:100%;margin-top:4px;font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px}
textarea{resize:vertical;min-height:64px}
.primary{width:100%;border:0;border-radius:10px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:600;padding:12px;cursor:pointer}
.primary:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{min-height:1.4em;margin:8px 0 0;font-size:.9rem;color:var(--muted)}
.days{display:flex;align-items:flex-end;gap:8px;height:130px}
.day{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:.75rem;color:var(--muted)}
.day i{display:block;width:100%;background:var(--accent);border-radius:6px 6px 0 0;min-height:2px}
.day em{font-style:normal;color:var(--ink);font-weight:600}
.row{display:grid;grid-template-columns:96px 1fr 28px;align-items:center;gap:8px;margin:6px 0;font-size:.85rem}
.bar{height:14px;background:var(--bg);border-radius:7px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:7px}
.row span:last-child{text-align:right;font-weight:600}
.head{display:flex;justify-content:space-between;align-items:center;gap:12px}
.head select{width:auto;margin:0 0 12px}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:56px 1fr auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
li:first-child{border-top:0}
.badge{width:56px;height:40px;border-radius:10px;border:2px solid var(--c);background:color-mix(in srgb,var(--c) 15%,transparent);display:grid;place-items:center;padding:3px}
.badge img{display:block;max-width:100%;max-height:100%;object-fit:contain}
li time{display:block;font-size:.85rem;color:var(--muted)}
li p{margin:2px 0 0;font-size:.9rem;white-space:pre-wrap;overflow-wrap:anywhere}
li button{border:0;background:transparent;color:var(--muted);font:inherit;font-size:.85rem;cursor:pointer;padding:4px 6px}
.empty{color:var(--muted);margin:0}
footer{font-size:.8rem;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:no-preference){.day i,.bar i{transition:height .25s,width .25s}}
</style>
</head>
<body>
<main>
<h1>Stool tracker</h1>

<section aria-labelledby="h-today">
  <h2 id="h-today" class="sr" style="position:absolute;left:-9999px">Today</h2>
  <div class="today"><b id="todayCount">0</b><span id="todayLabel">entries today</span></div>
</section>

<section aria-labelledby="h-add">
  <h2 id="h-add">Add an entry</h2>
  <div class="types" id="types" role="group" aria-label="Stool type"></div>
  <label>Date and time<input type="datetime-local" id="when"></label>
  <label>Notes (optional)<textarea id="notes" placeholder="Anything worth remembering"></textarea></label>
  <button class="primary" id="add" disabled>Save entry</button>
  <div style="border-top:1px solid var(--line);margin-top:16px;padding-top:14px">
    <h2>Log a no-stool day</h2>
    <label>Date<input type="date" id="noStoolDate"></label>
    <button class="primary" id="addNoStool" type="button">Save no-stool day</button>
  </div>
  <p class="msg" id="msg" role="status"></p>
</section>

<section aria-labelledby="h-daily">
  <h2 id="h-daily">Entries per day, last 7 days</h2>
  <div class="days" id="days"></div>
</section>

<section aria-labelledby="h-types">
  <div class="head">
    <h2 id="h-types">Type breakdown</h2>
    <select id="range" aria-label="Date range">
      <option value="7">Last 7 days</option>
      <option value="30" selected>Last 30 days</option>
      <option value="0">All entries</option>
    </select>
  </div>
  <div id="breakdown"></div>
</section>

<section aria-labelledby="h-log">
  <h2 id="h-log">History</h2>
  <ul id="log"></ul>
</section>

<footer>Entries are saved in this browser only. Clearing site data erases them.</footer>
</main>

const LABELS = {1:'Hard lumps',2:'Lumpy sausage',3:'Cracked sausage',4:'Smooth sausage',5:'Soft blobs',6:'Mushy',7:'Watery'};
let log = load();
let selected = null;

const $ = id => document.getElementById(id);
const color = t => `var(--t${t})`;

function load() {
  try { const r = localStorage.getItem(KEY); const a = r ? JSON.parse(r) : []; return Array.isArray(a) ? a : []; }
  catch (e) { return []; }
}
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(log)); return true; }
  catch (e) { $('msg').textContent = 'Could not save. Check that this browser allows site storage.'; return false; }
}
function pad(n) { return String(n).padStart(2, '0'); }
function dayKey(ts) { const d = new Date(ts); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function nowLocalInput() { const d = new Date(); return `${dayKey(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

function buildTypes() {
  const wrap = $('types');
  for (let t = 1; t <= 7; t++) {
    const b = document.createElement('button');
    b.type = 'button';
    b.style.setProperty('--c', color(t));
    b.setAttribute('aria-pressed', 'false');
    b.dataset.t = t;
    b.innerHTML = `<img src="${IMGS[t]}" alt=""><strong>${t}</strong><small>${LABELS[t]}</small>`;
    b.addEventListener('click', () => { selected = t; syncTypes(); });
    wrap.appendChild(b);
  }
}
function syncTypes() {
  document.querySelectorAll('#types button').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.t === selected)));
  $('add').disabled = selected === null;
}

function addNoStoolDay() {
  const date = $('noStoolDate').value;
  if (!date) { $('msg').textContent = 'Choose a date.'; return; }
  const [year, month, day] = date.split('-').map(Number);
  const ts = new Date(year, month - 1, day, 12).getTime();
  if (log.some(e => e.type === 0 && dayKey(e.ts) === date)) {
    $('msg').textContent = 'A no-stool day is already logged for that date.';
    return;
  }
  log.push({ id: uid(), ts, type: 0, notes: '' });
  if (!save()) { log.pop(); return; }
  $('msg').textContent = `Saved no-stool day for ${date}.`;
  render();
}

function addEntry() {
  if (selected === null) return;
  const ts = $('when').value ? new Date($('when').value).getTime() : Date.now();
  if (isNaN(ts)) { $('msg').textContent = 'Enter a valid date and time.'; return; }
  log.push({ id: uid(), ts, type: selected, notes: $('notes').value.trim() });
  if (!save()) { log.pop(); return; }
  $('msg').textContent = `Saved type ${selected}.`;
  selected = null; $('notes').value = ''; $('when').value = nowLocalInput();
  syncTypes(); render();
}

function remove(id) {
  if (!confirm('Delete this entry?')) return;
  log = log.filter(e => e.id !== id);
  save(); render();
}

function render() {
  const sorted = [...log].sort((a, b) => b.ts - a.ts);
  const today = dayKey(Date.now());
  const n = log.filter(e => e.type >= 1 && e.type <= 7 && dayKey(e.ts) === today).length;
  $('todayCount').textContent = n;
  $('todayLabel').textContent = n === 1 ? 'entry today' : 'entries today';

  // last 7 days
  const days = [];
  for (let i = 6; i >= 0; i--) { const d = new Date(); d.setDate(d.getDate() - i); days.push(d); }
  const counts = days.map(d => log.filter(e => e.type >= 1 && e.type <= 7 && dayKey(e.ts) === dayKey(d)).length);
  const max = Math.max(1, ...counts);
  const dEl = $('days'); dEl.innerHTML = '';
  days.forEach((d, i) => {
    const c = document.createElement('div'); c.className = 'day';
    c.innerHTML = `<em>${counts[i]}</em><i style="height:${(counts[i] / max) * 80}px"></i><span>${d.toLocaleDateString(undefined, { weekday: 'short' })}</span>`;
    dEl.appendChild(c);
  });

  // breakdown
  const r = +$('range').value;
  const cutoff = r ? Date.now() - r * 864e5 : 0;
  const inRange = log.filter(e => e.ts >= cutoff);
  const bEl = $('breakdown'); bEl.innerHTML = '';
  if (!inRange.length) { bEl.innerHTML = '<p class="empty">No entries in this range.</p>'; }
  else {
    const by = {}; inRange.forEach(e => by[e.type] = (by[e.type] || 0) + 1);
    const m = Math.max(...Object.values(by));
    for (let t = 1; t <= 7; t++) {
      const c = by[t] || 0;
      const row = document.createElement('div'); row.className = 'row';
      row.innerHTML = `<span>Type ${t}</span><div class="bar"><i style="width:${(c / m) * 100}%;background:${color(t)}"></i></div><span>${c}</span>`;
      bEl.appendChild(row);
    }
  }

  // history
  const ul = $('log'); ul.innerHTML = '';
  if (!sorted.length) { ul.innerHTML = '<li><p class="empty">No entries yet. Pick a type above and save your first one.</p></li>'; return; }
  sorted.forEach(e => {
    const li = document.createElement('li');
    const badge = document.createElement('div'); badge.className = 'badge';
    const body = document.createElement('div');
    const tm = document.createElement('time');
    if (e.type === 0) {
      badge.style.setProperty('--c', 'var(--muted)');
      badge.textContent = '—';
      tm.textContent = new Date(e.ts).toLocaleDateString(undefined, { weekday: 'short', month: 'short', day: 'numeric' }) + ' – No stool recorded';
    } else {
      badge.style.setProperty('--c', color(e.type));
      badge.innerHTML = `<img src="${IMGS[e.type]}" alt="">`;
      tm.textContent = new Date(e.ts).toLocaleString(undefined, { weekday: 'short', month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) + ' – Type ' + e.type + ', ' + LABELS[e.type];
    }
    body.appendChild(tm);
    if (e.notes) { const p = document.createElement('p'); p.textContent = e.notes; body.appendChild(p); }
    const del = document.createElement('button'); del.type = 'button'; del.textContent = 'Delete';
    del.setAttribute('aria-label', 'Delete entry from ' + tm.textContent);
    del.addEventListener('click', () => remove(e.id));
    li.append(badge, body, del);
    ul.appendChild(li);
  });
}

buildTypes();
$('when').value = nowLocalInput();
$('add').addEventListener('click', addEntry);
$('noStoolDate').value = dayKey(Date.now());
$('addNoStool').addEventListener('click', addNoStoolDay);
$('range').addEventListener('change', render);
render();
</script>
